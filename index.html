<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CALCULATOR</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    

    <div id = "calculator-frame">

        <div id = "calculator-screen"></div>

        <div id = "calculator-body">

            <div class = "number-panel">
                <div class = "numRowOne">
                    <button class = "number-button">1</button>
                    <button class = "number-button">2</button>
                    <button class = "number-button">3</button>
                </div>

                <div class = "numRowTwo">
                    <button class = "number-button">4</button>
                    <button class = "number-button">5</button>
                    <button class = "number-button">6</button>
                </div>

                <div class = "numRowThree">
                    <button class = "number-button">7</button>
                    <button class = "number-button">8</button>
                    <button class = "number-button">9</button>
                </div>
            </div>

            <div class = "operator-panel">
                <button class = "operator-button" id = "add">+</button>
                <button class = "operator-button" id = "subtract">-</button>
                <button class = "operator-button" id = "multiply">*</button>
                <button class = "operator-button" id = "divide">/</button>
                <button id = "equals-button">=</button>
            </div>

        </div>

        <button id = "clear-button">CLEAR</button>

    </div>


</body>
</html>
